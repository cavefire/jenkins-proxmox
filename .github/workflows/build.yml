name: Build

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, to derive the version from the latest tag
          fetch-depth: 0

      # Jenkins 2.319.x runs on Java 8 and 11; the plugin parent POM needs 11 to build.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Tag builds use the tag as version (without a leading "v"), all other builds
      # <tag>-<commits since tag>-<hash>, or 0.0.0-<commits>-<hash> before the first tag.
      - name: Set version
        env:
          # For pull requests the PR head commit, not the temporary merge commit
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif tag=$(git describe --tags --abbrev=0 "$COMMIT" 2>/dev/null); then
            version="${tag#v}-$(git rev-list --count "$tag..$COMMIT")-$(git rev-parse --short "$COMMIT")"
          else
            version="0.0.0-$(git rev-list --count "$COMMIT")-$(git rev-parse --short "$COMMIT")"
          fi
          echo "Plugin version: $version"
          echo "### Plugin version \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          mvn -B -ntp versions:set -DnewVersion="$version" -DgenerateBackupPoms=false

      # verify runs the tests first and only packages target/proxmox.hpi when they pass.
      - name: Run tests and build plugin
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: proxmox-plugin
          path: target/proxmox.hpi
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: proxmox-plugin

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: proxmox.hpi
          generate_release_notes: true
